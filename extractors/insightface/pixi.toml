[project]
name = "extractor-insightface"
version = "0.1.0"
description = "Shared face detection / landmarks / embedding cache for the R-DGG evaluation metrics"
authors = ["Anonymous <anonymous@example.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
numpy = "1.26.*"
pip = "*"
ffmpeg = "*"
cudnn = "8.*"
cuda-cudart = ">=12.9.79,<13"
libcufft = ">=11.4.1.4,<12"
libcurand = ">=10.3.10.19,<11"

[pypi-dependencies]
insightface = "==0.7.3"
# onnxruntime-gpu >= 1.17 ships CUDA 12 wheels; 1.16 only had CUDA 11.
# Pin a 1.19.x patch-level for reproducibility.
onnxruntime-gpu = "==1.19.2"
decord = "==0.6.0"
opencv-python-headless = "*"
scipy = "*"
tqdm = "*"

[tasks]
help = "python extract.py --help"
