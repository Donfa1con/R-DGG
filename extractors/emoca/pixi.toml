[project]
name = "extractor-emoca"
version = "0.1.0"
description = "Batched EMOCA video → FLAME-codes extractor (R-DGG evaluation)"
authors = ["Anonymous <anonymous@example.com>"]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

# ------------------------------------------------------------------
# Conda layer — Python + torch + the few packages that are awkward
# to install via pip (MKL pin keeps torch 2.1.1 working)
# ------------------------------------------------------------------
[dependencies]
python = "3.9.*"
mkl = "2023.2.*"
numpy = "1.26.*"
cython = "3.0.*"
setuptools = "<81"
wheel = "*"
pip = "*"
ninja = "*"
ffmpeg = "*"
pytorch       = { version = "==2.1.1", channel = "pytorch", build = "py3.9_cuda12.1*" }
torchvision   = { version = "==0.16.1", channel = "pytorch", build = "py39_cu121" }
torchaudio    = { version = "==2.1.1",  channel = "pytorch", build = "py39_cu121" }
pytorch-cuda  = { version = "12.1.*", channel = "pytorch" }
gcc_linux-64 = "11.*"
gxx_linux-64 = "11.*"
cuda-nvcc = "12.1.*"
cuda-cudart-dev = "12.1.*"
cuda-cccl = "12.1.*"
cuda-libraries-dev = "12.1.*"

# pixi → uv, by default uses isolated PEP-517 builds; chumpy and inferno
# both ship setup.py files that import pip directly, which the isolated
# build env doesn't have. Allow them to use the project env's tooling.
[pypi-options]
no-build-isolation = ["chumpy", "inferno", "insightface", "torchgeometry", "torchfile"]

# ------------------------------------------------------------------
# Pip layer — everything else
#   pytorch3d is built from source against the conda torch.
#   inferno is installed editable from the vendored _vendor/inferno (see README.md).
# ------------------------------------------------------------------
[pypi-dependencies]
numpy           = "*"
opencv-python   = "==4.9.0.80"
opencv-contrib-python = "==4.9.0.80"
opencv-python-headless = "==4.9.0.80"
kornia          = "==0.6.5"
hydra-core      = "==1.3.2"
pytorch-lightning = "==1.9.0"
torchmetrics    = "<1"
munch           = "==2.5.0"
torchgeometry   = "==0.1.2"
torchfile       = "==0.1.0"
compress-pickle = "==1.2.0"
decord          = "==0.6.0"
matplotlib      = "==3.7.5"
transformers    = "==4.36.2"
h5py            = "==3.8.0"
hickle           = "==5.0.2"
face-alignment   = "==1.3.5"
facenet-pytorch  = "==2.5.2"
imgaug           = "==0.4.0"
albumentations   = "==1.3.1"
chumpy           = { git = "https://github.com/mattloper/chumpy.git" }
gdown            = "==4.5.1"
ffmpeg-python    = "==0.2.0"
loguru           = "==0.6.0"
trimesh          = "==4.0.8"
scikit-video     = "*"
insightface      = "==0.6.2"
onnx             = "==1.15"
onnxruntime-gpu  = "==1.16.2"
mediapipe        = "==0.10.9"
"setuptools"     = "<81"          # avoids pkg_resources removal that pl 1.9 hits
wandb            = "==0.10.33"
fvcore           = "*"
iopath           = "*"
tqdm             = "*"
pandas           = "*"
pyrender         = "==0.1.45"
pyopengl         = "==3.1.*"
seaborn          = "==0.11.0"
plotly           = "*"
pyvista          = "*"
tensorly         = "*"
resampy          = "*"
scikit-image     = "*"
scikit-learn     = "*"
soundfile        = "*"
librosa          = "==0.9.2"
python-speech-features = "==0.6"

# inferno: editable install of the vendored checkout at _vendor/inferno (path is relative
# to this manifest). Clone it there before `pixi install` — see README.md (git URL + assets).
inferno = { path = "_vendor/inferno", editable = true }

# ------------------------------------------------------------------
# Tasks
# ------------------------------------------------------------------
[tasks]
# build pytorch3d in-place against the env's torch — only needs to run once
build-pytorch3d = """
test -f $CONDA_PREFIX/lib/python3.9/site-packages/pytorch3d/_C.cpython-39-x86_64-linux-gnu.so \
  && echo 'pytorch3d already built' \
  || ( FORCE_CUDA=1 MAX_JOBS=12 TORCH_CUDA_ARCH_LIST='8.9' \
        pip install --no-build-isolation \
        'git+https://github.com/facebookresearch/pytorch3d.git@v0.7.6' )
"""

# patch the deprecated `np.int` aliases in inferno (numpy ≥1.20 removed them)
patch-inferno = """
sed -i 's/np\\.int\\b/int/g; s/np\\.float\\b/float/g; s/np\\.bool\\b/bool/g' \
  _vendor/inferno/inferno/utils/DecaUtils.py
"""

setup = { depends-on = ["build-pytorch3d", "patch-inferno"] }

# convenience smoke test
smoke = """
python extract.py \
  --videos_dir ../../data/GT/LS_AL \
  --out_dir   /tmp/emoca_smoke \
  --batch_size 32 --num_workers 4 --limit 1
"""
