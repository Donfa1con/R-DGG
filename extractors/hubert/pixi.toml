[project]
name = "extractor-hubert"
version = "0.1.0"
description = "Per-wav HuBERT hidden-state cache — the audio driver for the R-DGG metric (rdgg/)"
authors = ["Anonymous <anonymous@example.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
numpy = "1.26.*"
pip = "*"

[pypi-dependencies]
# Same pin as extractors/vad, which is the combination proven to load torchaudio's soundfile backend.
# The default pypi wheel bundles CUDA 12.1, so this is GPU-capable without the conda pytorch channel.
torch = "==2.4.0"
torchaudio = "==2.4.0"
soundfile = "*"
transformers = "==4.44.2"

[tasks]
help = "python extract.py --help"
